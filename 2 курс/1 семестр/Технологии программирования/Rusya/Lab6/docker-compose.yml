version: '1.0'

services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: lab6
      POSTGRES_USER: lab6user
      POSTGRES_PASSWORD: lab6password
    ports:
      - "5430:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  pgdata: