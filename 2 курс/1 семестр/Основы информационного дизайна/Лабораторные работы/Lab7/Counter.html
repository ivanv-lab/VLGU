<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        var counter=0;
        function onCheck(){
            var b=confirm("");
            if(b) counter++;

            alert(counter);
        }
    </script>
    <button onclick="onCheck();">Confirm</button>
</body>
</html>
