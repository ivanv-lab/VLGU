<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function onPrompt(){
            var number=prompt("Write number 1-10","1");
            if(number>7.5) alert("true")
            else alert("false");
        }
    </script>
    <button onclick="onPrompt();">Prompt</button>
</body>
</html>
