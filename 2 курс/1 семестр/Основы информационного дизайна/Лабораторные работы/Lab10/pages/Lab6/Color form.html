<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <fieldset>
            <legend>About color</legend>
            <p><label for="color">Color</label>
                <input type="color"></p>

            <p>
                <div style="display: inline-block; vertical-align: top; margin-right: 30px;">
                    <p>
                        <label for="dominant-color">Dominant color</label>
                        <p><input type="radio">Red</p>
                        <p><input type="radio">Green</p>
                        <p><input type="radio">Blue</p>
                        <p><input type="radio">No color</p>
                    </p>
                </div>
                <div style="display: inline-block; vertical-align: top;">
                    <p>
                        <label for="mixed-colors">Mixed colors</label>
                        <p><input type="checkbox">Red</p>
                        <p><input type="checkbox">Green</p>
                        <p><input type="checkbox">Blue</p>
                        <p><input type="checkbox">Black</p>
                        <p><input type="checkbox">White</p>
                    </p>
                </div>
            </p>
        </fieldset>
    </form>
</body>
</html>
