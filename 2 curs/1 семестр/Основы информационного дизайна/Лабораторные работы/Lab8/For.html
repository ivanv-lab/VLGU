<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        function fun(){
            var num=prompt("Input count","1");
            var nums=[num];
            var oddNumbers=[];
            for(i=0;i<num;i++){
                nums[i]=prompt("Input number","1");
            }
            var oddCounter=0;
            for(i=0;i<num;i++){
                if(nums[i]%2==1){
                    oddNumbers[oddCounter]=nums[i];
                    oddCounter++;
                }
            }
            alert(oddNumbers);
        }
    </script>
    <button onclick="fun();">For</button>
</body>
</html>
