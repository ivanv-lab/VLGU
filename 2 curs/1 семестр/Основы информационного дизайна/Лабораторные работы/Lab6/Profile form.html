<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <fieldset>
            <legend>Main information</legend>
            <div style="display: inline-block; margin-right: 30px; width: 120px;">
                <p><label for="name">Name</label></p>
                <p><label for="surname">Surname</label></p>
                <p><label for="birthdate">Birthday date</label></p>
                <p><label for="adult">I am 18+</label></p>
            </div>
            <div style="display: inline-block;">
                <p><input type="text" id="name" required 
                    placeholder="Your name" name="name-input" size="30"></p>
                <p><input type="text" id="surname" required 
                    placeholder="Your surname" name="sur-input" size="30"></p>
                <p><input type="date" id="birthdate" required 
                    placeholder="Your birthdate" name="birthdate-input"></p>
                <p><input type="checkbox" id="adult" required 
                    placeholder="Your is adult" name="adult-check"></p>
            </div>
        </fieldset>
        <fieldset>
            <legend>Contacts</legend>
            <div style="display: inline-block; margin-right: 30px; width: 120px;">
                <p><label for="phone">Telephone number</label></p>
                <p><label for="email">E-mail</label></p>
                <p><label for="neturl">Social Net URL</label></p>
            </div>
            <div style="display: inline-block;">
                <p><input type="tel" id="phone" 
                    placeholder="+7" name="phone-input" size="11"></p>
                <p><input type="email" id="email" 
                    placeholder="test@example.com" name="email-input" size="50"></p>
                <p><input type="url" id="neturl" 
                    placeholder="http://" name="neturl-input"></p>
            </div>
        </fieldset>
        <fieldset>
            <legend>About</legend>
            <div style="display: inline-block; margin-right: 30px; width: 120px;">
                <p><label for="photo">Photo</label></p>
                <p><label for="about">About me</label></p>
            </div>
            <div style="display: inline-block; vertical-align: top;">
                <p><input type="file" id="photo"  
                    name="photo-input"></p>
                <!-- <p><input type="" id="email" 
                    placeholder="test@example.com" name="email-input" size="50"></p> -->
                <p><textarea style="min-width: 500px; min-height: 200px;"></textarea></p>
            </div>
        </fieldset>
        <p>
            <div style="display: inline-block; margin-right: 30px;">
                <p><label for="singin" id="singin"></label>
                    <input type="submit" id="singin" value="Submit" name="singin-button">
                </p>
            </div>
            <div style="display: inline-block; margin-right: 30px;">
                <p><label for="reset" id="reset"></label>
                    <input type="reset" id="reset" value="Reset" name="reset-button">
                </p>
            </div>
        </p>
    </form>
</body>
</html>
